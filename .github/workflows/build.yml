name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Verify executable
        run: test -x ./lop

      - name: Smoke test
        run: |
          ./lop --cw --best --insert -i instances/N-be75eec_150 > /tmp/lop-result.txt
          test -s /tmp/lop-result.txt
